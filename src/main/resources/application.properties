spring.application.name=food-delivery-platform

# MySQL Datasource Configuration
# Inside Docker: picks up SPRING_DATASOURCE_* env variables.
# Locally in IntelliJ: falls back to localhost and your food_app user.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/food_delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:food_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:FoodApp@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:foodDeliveryProjectSecretKeyForJwtAuthentication2026VerySecure}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Swagger / OpenAPI Settings
springdoc.override-with-generic-response=false

# Redis & Cache Settings
# Inside Docker: picks up 'redis'. Locally: falls back to 'localhost'.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false